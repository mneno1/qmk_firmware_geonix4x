name: Geonix41 Vial Firmware Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile firmware
        uses: qmk/qmk_action@v1
        with:
          command: qmk compile -kb geonix41/geonix41_oss -km vial

      - name: Prepare firmware
        run: |
          cp .build/geonix41_geonix41_oss_vial.bin geonix41_vial.bin

      - name: Set build date (JST)
        run: |
          echo "BUILD_DATE=$(TZ=Asia/Tokyo date +'%Y%m%d')" >> $GITHUB_ENV

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: geonix41-vial-${{ env.BUILD_DATE }}
          path: geonix41_vial.bin
