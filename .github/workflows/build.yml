name: Build Geonix41

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install QMK CLI
        run: |
          python3 -m pip install qmk

      - name: Setup QMK
        run: |
          qmk setup -y .

      - name: Compile
        run: |
          qmk compile -kb geonix41/geonix41_oss -km vial

      - name: Set build date (JST)
        run: |
          echo "BUILD_DATE=$(TZ=Asia/Tokyo date +'%Y%m%d')" >> $GITHUB_ENV

      - name: Upload generated header
        uses: actions/upload-artifact@v4
        with:
          name: generated-default-keyboard-h
          path: .build/obj_geonix41_geonix41_oss_vial/src/default_keyboard.h

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: geonix41-vial-${{ env.BUILD_DATE }}
          path: |
            *.uf2
            *.bin
            *.hex
